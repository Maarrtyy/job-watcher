name: Daily Job Check

on:
  schedule:
    # Runs at 05:00 UTC every day (~9:00 AM in the Maldives, UTC+4).
    # Change the hour below to shift the delivery time. Note: GitHub's
    # scheduler can run a few minutes late during high load.
    - cron: "0 5 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit seen.json back

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_watcher.py

      - name: Save seen-jobs state
        run: |
          git config user.name "job-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          git diff --quiet --cached || git commit -m "Update seen jobs [skip ci]"
          git push
